{% extends "_base.html" %}

{% block title %}Eliminar publicación | Cuaderno{% endblock %}

{% block content %}
<section class="form-page delete-page">
    <p class="eyebrow">CONFIRMACIÓN</p>
    <h1>¿Eliminar esta<br><em>publicación?</em></h1>
    <p class="delete-copy">“{{ post.title }}” se eliminará permanentemente.</p>
    <form method="post" class="post-form">
        {% csrf_token %}
        <div class="form-actions">
            <button class="button button-danger" type="submit">Sí, eliminar</button>
            <a class="text-link" href="{{ post.get_absolute_url }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
