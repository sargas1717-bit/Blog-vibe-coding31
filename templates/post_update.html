{% extends "_base.html" %}

{% block title %}Editar publicación | Cuaderno{% endblock %}

{% block content %}
<section class="form-page">
    <p class="eyebrow">EDICIÓN</p>
    <h1>Revisa tu<br><em>publicación.</em></h1>
    <form method="post" class="post-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="button" type="submit">Guardar cambios</button>
            <a class="text-link" href="{{ object.get_absolute_url }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
